<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifikasi — Peerly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="app" id="shell"></div>

<script type="module">
  import { api, requireAuth } from '/js/api.js';
  import { mountShell, fmtDateTime, escapeHtml, toast } from '/js/ui.js';

  const user = requireAuth();
  if (!user) throw new Error('redirect');
  mountShell(null);

  const main = document.getElementById('mainContent');
  const { notifications } = await api('/api/notifications');

  main.innerHTML = `
    <div class="main-head">
      <div><h1>Notifikasi</h1><p class="sub">Semua pembaruan terkait sesi dan poin.</p></div>
      ${notifications.some(n=>!n.read_at) ? `<button class="btn-sm outline" id="btnRead">Tandai semua dibaca</button>` : ''}
    </div>

    ${notifications.length ? notifications.map(n => `
      <div class="list-item" style="background:${n.read_at ? 'var(--color-bg-raised)' : '#F6EFD8'};">
        <div>
          <h4>${escapeHtml(n.title)}</h4>
          <div class="meta">${fmtDateTime(n.created_at)}</div>
          ${n.body ? `<p style="margin-top:6px;">${escapeHtml(n.body)}</p>` : ''}
        </div>
        <div class="actions">
          ${n.link ? `<a href="${escapeHtml(n.link)}" class="btn-sm outline">Buka</a>` : ''}
        </div>
      </div>
    `).join('') : `<div class="empty"><h3>Belum ada notifikasi</h3></div>`}
  `;

  document.getElementById('btnRead')?.addEventListener('click', async () => {
    await api('/api/notifications/read-all', { method: 'POST' });
    toast('Semua ditandai dibaca', 'success');
    location.reload();
  });
</script>
</body>
</html>
