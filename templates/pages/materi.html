<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank Materi — Peerly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="app" id="shell"></div>

<!-- View modal -->
<div class="modal-backdrop" id="viewModal">
  <div class="modal" style="max-width:720px;">
    <button class="close" id="viewClose">×</button>
    <div id="viewBody"></div>
  </div>
</div>

<!-- Add modal (tutor only) -->
<div class="modal-backdrop" id="addModal">
  <div class="modal" style="max-width:620px;">
    <button class="close" id="addClose">×</button>
    <h2>Tambah materi</h2>
    <div id="addAlert"></div>
    <form id="addForm">
      <div class="form-group">
        <label>Judul</label>
        <input name="title" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Mata pelajaran</label>
          <select name="mata_pelajaran" id="aMp" required></select>
        </div>
        <div class="form-group">
          <label>Jenjang</label>
          <select name="jenjang" required>
            <option value="SD">SD</option><option value="SMP">SMP</option><option value="SMA">SMA</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Deskripsi singkat</label>
        <input name="description">
      </div>
      <div class="form-group">
        <label>Isi / rangkuman</label>
        <textarea name="content" style="min-height:140px;"></textarea>
      </div>
      <div class="form-group">
        <label>Link eksternal (opsional)</label>
        <input name="url" placeholder="https://…">
      </div>
      <button class="btn btn-primary" type="submit">Simpan</button>
    </form>
  </div>
</div>

<script type="module">
  import { api, requireAuth } from '/js/api.js';
  import { mountShell, SUBJECTS, JENJANGS, escapeHtml, fmtDateTime, toast } from '/js/ui.js';

  const user = requireAuth();
  if (!user) throw new Error('redirect');
  mountShell('/pages/materi.html');
  const main = document.getElementById('mainContent');
  const isTutor = user.role === 'tutor';

  main.innerHTML = `
    <div class="main-head">
      <div>
        <h1>Bank Materi</h1>
        <p class="sub">Rangkuman dan modul belajar yang bisa diakses kapan saja — tanpa jadwal sesi.</p>
      </div>
      ${isTutor ? `<button class="btn btn-primary" id="btnAdd">+ Tambah materi</button>` : ''}
    </div>

    <div class="toolbar">
      <div><label>Cari</label><input id="fQ" placeholder="Judul / deskripsi"></div>
      <div><label>Mata pelajaran</label>
        <select id="fMp"><option value="">Semua</option>${SUBJECTS.map(s=>`<option>${s}</option>`).join('')}</select></div>
      <div><label>Jenjang</label>
        <select id="fJj"><option value="">Semua</option>${JENJANGS.map(j=>`<option>${j}</option>`).join('')}</select></div>
      <div></div><div></div>
      <div><label>&nbsp;</label><button class="btn-sm" id="btnFilter" style="width:100%;">Terapkan</button></div>
    </div>

    <div id="results" class="grid-3"></div>
  `;

  document.getElementById('btnFilter').addEventListener('click', load);
  if (isTutor) {
    const aMp = document.getElementById('aMp');
    aMp.innerHTML = SUBJECTS.map(s => `<option>${s}</option>`).join('');
    document.getElementById('btnAdd').addEventListener('click', () => {
      document.getElementById('addAlert').innerHTML = '';
      document.getElementById('addModal').classList.add('open');
    });
  }
  await load();

  async function load() {
    const results = document.getElementById('results');
    results.innerHTML = `<div class="empty" style="grid-column: 1/-1; padding:20px;">Memuat…</div>`;
    const params = new URLSearchParams();
    const mp = document.getElementById('fMp').value;
    const jj = document.getElementById('fJj').value;
    const q  = document.getElementById('fQ').value.trim();
    if (mp) params.set('mata_pelajaran', mp);
    if (jj) params.set('jenjang', jj);
    if (q)  params.set('q', q);
    const { materi } = await api('/api/materi?' + params.toString());
    if (!materi.length) {
      results.innerHTML = `<div class="empty" style="grid-column: 1/-1;"><h3>Belum ada materi</h3><p>${isTutor ? 'Kamu bisa jadi yang pertama menambahkan!' : 'Coba filter lain.'}</p></div>`;
      return;
    }
    results.innerHTML = materi.map(m => `
      <div class="card">
        <div class="chips" style="margin-bottom:8px;">
          <span class="chip">${escapeHtml(m.mata_pelajaran)}</span>
          <span class="chip amber">${escapeHtml(m.jenjang)}</span>
        </div>
        <h3>${escapeHtml(m.title)}</h3>
        <p class="meta" style="margin:6px 0 12px;">${escapeHtml(m.description || '')}</p>
        <button class="btn-sm outline" data-view="${m.id}">Buka materi</button>
      </div>
    `).join('');
    results.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => openView(b.dataset.view)));
  }

  // View modal
  const viewModal = document.getElementById('viewModal');
  document.getElementById('viewClose').onclick = () => viewModal.classList.remove('open');
  viewModal.addEventListener('click', e => { if (e.target === viewModal) viewModal.classList.remove('open'); });

  async function openView(id) {
    const { materi: m } = await api(`/api/materi/${id}`);
    document.getElementById('viewBody').innerHTML = `
      <div class="chips" style="margin-bottom:8px;">
        <span class="chip">${escapeHtml(m.mata_pelajaran)}</span>
        <span class="chip amber">${escapeHtml(m.jenjang)}</span>
      </div>
      <h2>${escapeHtml(m.title)}</h2>
      <p class="meta" style="margin:6px 0 14px;">${escapeHtml(m.description || '')}</p>
      ${m.content ? `<div style="white-space:pre-wrap; line-height:1.7;">${escapeHtml(m.content)}</div>` : ''}
      ${m.url ? `<p style="margin-top:14px;"><a class="btn-sm" href="${escapeHtml(m.url)}" target="_blank" rel="noopener">Buka link eksternal ↗</a></p>` : ''}
      <p class="meta" style="margin-top:16px;">Ditambahkan: ${fmtDateTime(m.created_at)}</p>
    `;
    viewModal.classList.add('open');
  }

  // Add modal (tutor)
  if (isTutor) {
    const addModal = document.getElementById('addModal');
    document.getElementById('addClose').onclick = () => addModal.classList.remove('open');
    addModal.addEventListener('click', e => { if (e.target === addModal) addModal.classList.remove('open'); });

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        await api('/api/materi', { method: 'POST', body: {
          title: fd.get('title'),
          description: fd.get('description') || null,
          mata_pelajaran: fd.get('mata_pelajaran'),
          jenjang: fd.get('jenjang'),
          content: fd.get('content') || null,
          url: fd.get('url') || null,
        }});
        addModal.classList.remove('open');
        toast('Materi tersimpan', 'success');
        e.target.reset();
        load();
      } catch (err) {
        document.getElementById('addAlert').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });
  }
</script>
</body>
</html>
