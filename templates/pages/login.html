<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — Peerly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<header class="site-header">
  <nav class="nav container">
    <a href="/" class="brand">
      <img src="/static/assets/logo-mark.svg" alt="">
      <span>Peerly</span>
    </a>
    <ul class="nav-links">
      <li><a href="/pages/register">Belum punya akun? Daftar</a></li>
    </ul>
  </nav>
</header>

<main class="container">
  <div class="form-card">
    <h1>Masuk</h1>
    <p class="sub">Lanjutkan belajar atau mengajar bersama.</p>

    <div id="alert" aria-live="polite"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="identifier">Email atau username</label>
        <input id="identifier" name="identifier" type="text" required autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <button id="submitBtn" type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">
        Masuk
      </button>
    </form>

    <div class="form-footer">
      <span class="small">Belum punya akun? <a href="/pages/register">Daftar di sini</a></span>
    </div>
  </div>
</main>

<script type="module">
import { api, setUser } from '/static/js/api.js';

const form = document.getElementById('loginForm');
const alertBox = document.getElementById('alert');
const button = document.getElementById('submitBtn');

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  alertBox.innerHTML = '';
  button.disabled = true;
  button.textContent = 'Memproses...';
  const values = new FormData(form);
  try {
    const result = await api('/api/auth/login', {
      method: 'POST',
      auth: false,
      body: {
        identifier: values.get('identifier').trim(),
        password: values.get('password'),
      },
    });
    setUser({ ...result.user, name: result.user.full_name });
    location.href = '/pages/dashboard';
  } catch (error) {
    alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(error.message)}</div>`;
  } finally {
    button.disabled = false;
    button.textContent = 'Masuk';
  }
});

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
