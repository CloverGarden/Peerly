<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poin & Sertifikat — Peerly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="app" id="shell"></div>

<script type="module">
  import { api, requireAuth, getUser } from '/js/api.js';
  import { mountShell, escapeHtml, fmtDateTime, toast } from '/js/ui.js';

  const user = requireAuth('tutor');
  if (!user) throw new Error('redirect');
  mountShell('/pages/poin.html');
  const main = document.getElementById('mainContent');

  await render();

  async function render() {
    const [pts, { certificates }] = await Promise.all([
      api('/api/tutor/points'),
      api('/api/tutor/certificates'),
    ]);

    main.innerHTML = `
      <div class="main-head">
        <div>
          <h1>Poin & Sertifikat</h1>
          <p class="sub">Setiap sesi yang selesai menambah poin dan jam mengajar. Sertifikat bisa diunduh setelah tier terbuka.</p>
        </div>
      </div>

      <div class="grid-4" style="margin-bottom:28px;">
        <div class="stat"><div class="label">Poin volunteer</div><div class="value">${pts.points}</div></div>
        <div class="stat"><div class="label">Jam mengajar</div><div class="value">${pts.hours_taught.toFixed(1)}</div></div>
        <div class="stat"><div class="label">Tier saat ini</div><div class="value" style="font-size:1.5rem;">${pts.tier}</div></div>
        <div class="stat"><div class="label">Rating</div><div class="value">${pts.rating ?? '-'}</div><div class="trend">${pts.rating_count} ulasan</div></div>
      </div>

      <div class="card" style="margin-bottom:28px;">
        <h3>Perjalanan tier</h3>
        <p class="meta" style="margin-bottom:14px;">Tier naik otomatis saat jam mengajar bertambah.</p>
        <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:14px;">
          ${[
            { name: 'Bronze',   hours: 5 },
            { name: 'Silver',   hours: 20 },
            { name: 'Gold',     hours: 50 },
            { name: 'Platinum', hours: 100 },
          ].map(t => {
            const unlocked = pts.hours_taught >= t.hours;
            return `
              <div class="card" style="text-align:center; padding:16px; background:${unlocked ? '#E9EFE4' : 'var(--color-bg)'}; border-color: ${unlocked ? 'var(--color-forest)' : 'var(--color-line)'};">
                <div style="font-family:var(--font-display); font-size:1.5rem; color:var(--color-forest); font-weight:600;">${t.name}</div>
                <div class="meta">${t.hours} jam</div>
                <div style="margin-top:6px; font-size:0.85rem; color:${unlocked ? 'var(--color-forest)' : 'var(--color-ink-soft)'};">
                  ${unlocked ? '✓ Terbuka' : 'Terkunci'}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>

      <div class="card" style="margin-bottom:28px;">
        <h3>Terbitkan sertifikat</h3>
        <p class="meta" style="margin-bottom:14px;">
          Setiap sertifikat merekam tier, jam mengajar, dan poin saat diterbitkan. Minimal 5 jam untuk tier Bronze.
        </p>
        ${pts.hours_taught >= 5
          ? `<button class="btn btn-primary" id="btnIssue">Terbitkan sertifikat ${pts.tier}</button>`
          : `<div class="alert alert-info">Masih ${Math.max(0, 5 - pts.hours_taught).toFixed(1)} jam lagi menuju Bronze.</div>`
        }
      </div>

      <h3 style="margin-bottom:12px;">Sertifikat saya (${certificates.length})</h3>
      ${certificates.length ? certificates.map(c => `
        <div class="list-item">
          <div>
            <h4>Sertifikat tier ${escapeHtml(c.tier)}</h4>
            <div class="meta">Kode: <code>${escapeHtml(c.cert_code)}</code> · ${fmtDateTime(c.issued_at)}</div>
            <div class="chips">
              <span class="chip">${c.hours_at_issue.toFixed(1)} jam</span>
              <span class="chip amber">${c.points_at_issue} poin</span>
            </div>
          </div>
          <div class="actions">
            <button class="btn-sm outline" data-view="${c.id}">Lihat</button>
            <button class="btn-sm" data-download="${c.id}">Unduh</button>
          </div>
        </div>
      `).join('') : `<div class="empty"><h3>Belum ada sertifikat</h3><p>Terbitkan sertifikat setelah mencapai tier Bronze (5 jam mengajar).</p></div>`}

      <div id="certPreview" style="display:none; margin-top:28px;"></div>
    `;

    document.getElementById('btnIssue')?.addEventListener('click', async () => {
      try {
        const { certificate } = await api('/api/tutor/certificate', { method: 'POST' });
        toast(`Sertifikat ${certificate.tier} diterbitkan`, 'success');
        render();
      } catch (err) { toast(err.message, 'error'); }
    });

    main.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
      const c = certificates.find(x => x.id == b.dataset.view);
      renderCert(c, false);
    }));
    main.querySelectorAll('[data-download]').forEach(b => b.addEventListener('click', () => {
      const c = certificates.find(x => x.id == b.dataset.download);
      renderCert(c, true);
    }));
  }

  function renderCert(c, download) {
    const u = getUser();
    const html = `
      <div class="certificate" id="certEl">
        <span class="mark">${escapeHtml(c.cert_code)}</span>
        <div style="font-family: var(--font-body); color: var(--color-ink-soft); letter-spacing:4px; font-size:0.85rem;">SERTIFIKAT VOLUNTEER</div>
        <h2 style="margin-top:14px;">Peerly</h2>
        <p style="margin-top:18px; color:var(--color-ink-soft);">Diberikan kepada</p>
        <div class="cursive">${escapeHtml(u.name)}</div>
        <p style="color:var(--color-ink-soft); max-width:52ch; margin:0 auto;">
          atas dedikasinya mengajar <strong>${c.hours_at_issue.toFixed(1)} jam</strong>
          dan mengumpulkan <strong>${c.points_at_issue} poin volunteer</strong>
          dalam program bimbingan belajar peer-to-peer Peerly.
        </p>
        <div class="tier-badge">Tier ${escapeHtml(c.tier)}</div>
        <p class="meta" style="margin-top:20px;">Diterbitkan ${fmtDateTime(c.issued_at)}</p>
      </div>
      ${!download ? '' : `<p style="text-align:center; margin-top:14px;" class="meta">Gunakan "Simpan sebagai PDF" di dialog cetak untuk menyimpan.</p>`}
    `;
    const container = document.getElementById('certPreview');
    container.innerHTML = html;
    container.style.display = 'block';
    container.scrollIntoView({ behavior: 'smooth' });

    if (download) {
      setTimeout(() => window.print(), 300);
    }
  }
</script>

<style media="print">
  @page { size: A4 landscape; margin: 20mm; }
  body * { visibility: hidden !important; }
  #certEl, #certEl * { visibility: visible !important; }
  #certEl {
    position: absolute;
    inset: 0;
    margin: 0 !important;
    max-width: none !important;
    border: 4px double var(--color-forest);
  }
</style>
</body>
</html>
