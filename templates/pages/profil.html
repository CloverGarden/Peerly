<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Saya — Peerly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="app" id="shell"></div>

<script type="module">
  import { api, requireAuth, getUser } from '/js/api.js';
  import { mountShell, SUBJECTS, JENJANGS, toast, escapeHtml } from '/js/ui.js';

  const user = requireAuth();
  if (!user) throw new Error('redirect');

  mountShell('/pages/profil.html');
  const main = document.getElementById('mainContent');

  const welcome = new URLSearchParams(location.search).get('welcome') === '1';
  const roleIsTutor = user.role === 'tutor';

  main.innerHTML = `
    <div class="main-head">
      <div>
        <h1>Profil Saya</h1>
        <p class="sub">Lengkapi profil agar sistem bisa mencocokkan dengan ${roleIsTutor ? 'siswa' : 'tutor'} yang tepat.</p>
      </div>
    </div>

    ${welcome ? `<div class="alert alert-info">Akun berhasil dibuat. Lengkapi profil dulu, ya — ini jadi dasar sistem matching.</div>` : ''}

    <div class="card" style="max-width:720px;">
      <div id="alert"></div>
      <form id="profileForm">
        <div class="form-row">
          <div class="form-group">
            <label>Nama</label>
            <input value="${escapeHtml(user.name)}" disabled>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input value="${escapeHtml(user.email)}" disabled>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="phone">No. HP / WhatsApp</label>
            <input id="phone" name="phone" type="tel" placeholder="08xx...">
          </div>
          <div class="form-group">
            <label for="lokasi">Lokasi (Kota / Kabupaten)</label>
            <input id="lokasi" name="lokasi" type="text" placeholder="mis. Depok">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="jenjang">${roleIsTutor ? 'Jenjang yang bisa diajar' : 'Jenjang saya'}</label>
            <select id="jenjang" name="jenjang">
              <option value="">—</option>
              ${JENJANGS.map(j => `<option value="${j}">${j}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label for="kelas">${roleIsTutor ? 'Kelas spesifik (opsional)' : 'Kelas saya'}</label>
            <input id="kelas" name="kelas" placeholder="mis. Kelas 8 / Kelas 11 IPA">
          </div>
        </div>

        <div class="form-group">
          <label>Mata pelajaran ${roleIsTutor ? 'yang bisa diajar' : 'yang ingin dipelajari'}</label>
          <div id="subjectsBox" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
          <div class="form-help">Pilih satu atau beberapa.</div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="mode">Preferensi mode belajar</label>
            <select id="mode" name="mode_preference">
              <option value="">—</option>
              <option value="online">Online (video call)</option>
              <option value="offline">Offline (tatap muka)</option>
              <option value="both">Keduanya</option>
            </select>
          </div>
          <div class="form-group">
            <label for="gaya">Gaya belajar yang disukai</label>
            <select id="gaya" name="gaya_belajar">
              <option value="">—</option>
              <option value="visual">Visual (diagram, gambar)</option>
              <option value="auditori">Auditori (penjelasan)</option>
              <option value="kinestetik">Kinestetik (praktik)</option>
              <option value="campuran">Campuran</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="availability">Ketersediaan waktu</label>
          <textarea id="availability" name="availability" placeholder="mis. Senin–Jumat sore setelah jam 17:00, akhir pekan pagi"></textarea>
        </div>

        <div class="form-group">
          <label for="bio">Bio singkat</label>
          <textarea id="bio" name="bio" placeholder="${roleIsTutor ? 'Pengalaman mengajar, prestasi, metode mengajar favorit…' : 'Hal yang paling membuat kamu kesulitan, atau target belajar jangka pendekmu…'}"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Simpan profil</button>
      </form>
    </div>
  `;

  // Render subject chips
  const subjectsBox = document.getElementById('subjectsBox');
  SUBJECTS.forEach(s => {
    const l = document.createElement('label');
    l.style.cssText = 'display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--color-line);border-radius:999px;cursor:pointer;font-size:0.88rem;background:#fff;';
    l.innerHTML = `<input type="checkbox" name="subject" value="${s}" style="margin:0;"> ${s}`;
    subjectsBox.appendChild(l);
  });

  // Load existing
  const { profile } = await api('/api/profile');
  if (profile) {
    for (const k of ['phone','bio','lokasi','mode_preference','gaya_belajar','availability','jenjang','kelas']) {
      const el = document.getElementById(k === 'mode_preference' ? 'mode' : k === 'gaya_belajar' ? 'gaya' : k);
      if (el && profile[k]) el.value = profile[k];
    }
    const picked = (profile.mata_pelajaran || '').split(',').map(s=>s.trim()).filter(Boolean);
    document.querySelectorAll('input[name="subject"]').forEach(cb => {
      if (picked.includes(cb.value)) cb.checked = true;
    });
  }

  document.getElementById('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const subjects = [...document.querySelectorAll('input[name="subject"]:checked')].map(i => i.value);
    try {
      await api('/api/profile', {
        method: 'PUT',
        body: {
          phone: fd.get('phone'),
          bio: fd.get('bio'),
          lokasi: fd.get('lokasi'),
          jenjang: fd.get('jenjang'),
          kelas: fd.get('kelas'),
          mode_preference: fd.get('mode_preference'),
          gaya_belajar: fd.get('gaya_belajar'),
          availability: fd.get('availability'),
          mata_pelajaran: subjects,
        }
      });
      toast('Profil tersimpan', 'success');
      if (welcome) setTimeout(() => location.href = '/pages/dashboard.html', 900);
    } catch (err) {
      document.getElementById('alert').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    }
  });
</script>
</body>
</html>
