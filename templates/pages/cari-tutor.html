
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cari Tutor — Peerly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<div class="app" id="shell"></div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <button class="close" id="modalClose" type="button">×</button>
    <h2>Ajukan sesi belajar</h2>
    <p class="meta" id="modalTutorInfo"></p>
    <div id="modalAlert"></div>

    <form id="sessionForm" style="margin-top:14px;">
      <input type="hidden" name="tutor_id">

      <div class="form-row">
        <div class="form-group">
          <label>Mata pelajaran</label>
          <select name="subject_id" id="mp" required></select>
        </div>
        <div class="form-group">
          <label>Jenjang</label>
          <select name="jenjang" id="jj" required>
            <option value="SD">SD</option>
            <option value="SMP">SMP</option>
            <option value="SMA">SMA</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Topik (opsional)</label>
        <input name="topik" placeholder="mis. Persamaan kuadrat">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Tanggal & waktu</label>
          <input name="scheduled_at" id="scheduledAt" type="datetime-local" required>
        </div>
        <div class="form-group">
          <label>Durasi (menit)</label>
          <input name="duration_min" type="number" value="60" min="30" max="180" step="15" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Mode</label>
          <select name="mode" required>
            <option value="online">Online (video call)</option>
            <option value="offline">Offline (tatap muka)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Lokasi / Link (opsional)</label>
          <input name="location_or_link" placeholder="mis. Perpustakaan Kota / link Zoom">
        </div>
      </div>

      <div class="form-group">
        <label>Catatan untuk tutor</label>
        <textarea name="notes" placeholder="Hal yang perlu diketahui tutor"></textarea>
      </div>

      <button class="btn btn-primary" id="submitSession" type="submit">
        Kirim permintaan
      </button>
    </form>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { mountShell, stars, toast, escapeHtml } from '/static/js/ui.js';

const configResponse = await fetch('/api/config');
if (!configResponse.ok) {
  throw new Error('Konfigurasi aplikasi gagal dimuat.');
}

const config = await configResponse.json();

const supabase = createClient(
  config.supabaseUrl,
  config.supabasePublishableKey
);

const {
  data: { session },
  error: sessionError
} = await supabase.auth.getSession();

if (sessionError || !session) {
  window.location.replace('/pages/login.html');
  throw new Error('Pengguna belum login.');
}

const currentUser = session.user;

const { data: profile, error: profileError } = await supabase
  .from('profiles')
  .select('id, full_name, role, location')
  .eq('id', currentUser.id)
  .single();

if (profileError || !profile || profile.role !== 'siswa') {
  window.location.replace('/pages/login.html');
  throw new Error('Halaman ini hanya dapat diakses oleh siswa.');
}

mountShell('/pages/cari-tutor.html');

const main = document.getElementById('mainContent');

if (!main) {
  throw new Error('Elemen mainContent tidak ditemukan. Periksa mountShell pada ui.js.');
}

const state = {
  tutors: [],
  subjects: [],
  studentSubjects: [],
  studentLevel: null,
  selectedTutor: null,
  loading: false
};

main.innerHTML = `
  <div class="main-head">
    <div>
      <h1>Cari Tutor</h1>
      <p class="sub">Temukan tutor berdasarkan mata pelajaran, jenjang, dan preferensi belajarmu.</p>
    </div>
  </div>

  <div class="toolbar">
    <div>
      <label>Mata pelajaran</label>
      <select id="fMp">
        <option value="">Semua</option>
      </select>
    </div>

    <div>
      <label>Jenjang</label>
      <select id="fJj">
        <option value="">Semua</option>
        <option value="SD">SD</option>
        <option value="SMP">SMP</option>
        <option value="SMA">SMA</option>
      </select>
    </div>

    <div>
      <label>Lokasi</label>
      <input id="fLok" placeholder="mis. Depok">
    </div>

    <div>
      <label>Mode</label>
      <select id="fMode">
        <option value="">Semua</option>
        <option value="online">Online</option>
        <option value="offline">Offline</option>
      </select>
    </div>

    <div>
      <label>&nbsp;</label>
      <button class="btn-sm" id="btnFilter" style="width:100%;">
        Terapkan
      </button>
    </div>
  </div>

  <div id="results">
    <div class="empty" style="padding:20px;">Memuat tutor...</div>
  </div>
`;

const results = document.getElementById('results');
const btnFilter = document.getElementById('btnFilter');

const modal = document.getElementById('modal');
const sessionForm = document.getElementById('sessionForm');
const modalAlert = document.getElementById('modalAlert');
const submitSession = document.getElementById('submitSession');

const filterMp = document.getElementById('fMp');
const filterJj = document.getElementById('fJj');
const filterLok = document.getElementById('fLok');
const filterMode = document.getElementById('fMode');

function showError(message) {
  results.innerHTML = `
    <div class="empty">
      <h3>Terjadi kesalahan</h3>
      <p>${escapeHtml(message)}</p>
    </div>
  `;
}

function getTutorSubjects(tutor) {
  return (tutor.user_subjects || [])
    .filter(item => item.interest === 'teach')
    .map(item => ({
      id: item.subject_id,
      name: item.subjects?.name
    }))
    .filter(item => item.id && item.name);
}

function getTutorLevels(tutor) {
  return tutor.tutor_profiles?.teaching_levels || [];
}

function getTutorRating(tutorId) {
  const feedbacks = state.feedbacks.filter(
    item => item.to_user_id === tutorId
  );

  if (!feedbacks.length) {
    return {
      rating: null,
      count: 0
    };
  }

  const total = feedbacks.reduce(
    (sum, item) => sum + Number(item.rating || 0),
    0
  );

  return {
    rating: Number((total / feedbacks.length).toFixed(1)),
    count: feedbacks.length
  };
}

function getTutorPoints(tutorId) {
  return state.points.find(
    item => item.tutor_id === tutorId
  ) || {
    points: 0,
    hours_taught: 0,
    tier: 'Starter'
  };
}

async function loadInitialData() {
  const [
    subjectsResponse,
    studentProfileResponse,
    studentSubjectsResponse
  ] = await Promise.all([
    supabase
      .from('subjects')
      .select('id, name')
      .order('name'),

    supabase
      .from('student_profiles')
      .select('jenjang, kelas')
      .eq('user_id', currentUser.id)
      .maybeSingle(),

    supabase
      .from('user_subjects')
      .select('subject_id, subjects(id, name)')
      .eq('user_id', currentUser.id)
      .eq('interest', 'learn')
  ]);

  if (subjectsResponse.error) throw subjectsResponse.error;
  if (studentProfileResponse.error) throw studentProfileResponse.error;
  if (studentSubjectsResponse.error) throw studentSubjectsResponse.error;

  state.subjects = subjectsResponse.data || [];
  state.studentLevel = studentProfileResponse.data?.jenjang || null;

  state.studentSubjects = (studentSubjectsResponse.data || [])
    .map(item => item.subjects?.id)
    .filter(Boolean);

  filterMp.innerHTML = `
    <option value="">Semua</option>
    ${state.subjects.map(subject => `
      <option value="${escapeHtml(subject.id)}">
        ${escapeHtml(subject.name)}
      </option>
    `).join('')}
  `;

  if (state.studentLevel) {
    filterJj.value = state.studentLevel;
  }

  if (state.studentSubjects.length) {
    filterMp.value = state.studentSubjects[0];
  }
}

async function loadTutors() {
  if (state.loading) return;

  state.loading = true;
  btnFilter.disabled = true;

  results.innerHTML = `
    <div class="empty" style="padding:20px;">
      Memuat tutor...
    </div>
  `;

  try {
    const [
      tutorResponse,
      pointsResponse
    ] = await Promise.all([
      supabase
        .from('profiles')
        .select(`
          id,
          full_name,
          bio,
          location,
          mode_preference,
          availability,
          tutor_profiles!inner (
            verified,
            experience_description,
            teaching_levels
          ),
          user_subjects!inner (
            subject_id,
            interest,
            subjects (
              id,
              name
            )
          )
        `)
        .eq('role', 'tutor')
        .eq('user_subjects.interest', 'teach'),

      supabase
        .from('tutor_points_summary')
        .select('tutor_id, points, hours_taught, tier')
    ]);

    if (tutorResponse.error) throw tutorResponse.error;
    if (pointsResponse.error) throw pointsResponse.error;

    state.points = pointsResponse.data || [];

    const tutors = tutorResponse.data || [];

    if (!tutors.length) {
      state.tutors = [];
      renderTutors();
      return;
    }

    const tutorIds = tutors.map(tutor => tutor.id);

    const { data: feedbacks, error: feedbackError } = await supabase
      .from('feedbacks')
      .select('to_user_id, rating')
      .in('to_user_id', tutorIds);

    if (feedbackError) throw feedbackError;

    state.feedbacks = feedbacks || [];
    state.tutors = tutors;

    renderTutors();

  } catch (error) {
    console.error(error);
    showError(error.message || 'Gagal mengambil data tutor.');
  } finally {
    state.loading = false;
    btnFilter.disabled = false;
  }
}

function renderTutors() {
  const mp = filterMp.value;
  const jj = filterJj.value;
  const location = filterLok.value.trim().toLowerCase();
  const mode = filterMode.value;

  const filtered = state.tutors
    .map(tutor => {
      const subjects = getTutorSubjects(tutor);
      const levels = getTutorLevels(tutor);
      const rating = getTutorRating(tutor.id);
      const points = getTutorPoints(tutor.id);

      return {
        ...tutor,
        subjects,
        levels,
        rating,
        points
      };
    })
    .filter(tutor => {
      if (mp && !tutor.subjects.some(s => s.id === mp)) {
        return false;
      }

      if (jj && !tutor.levels.includes(jj)) {
        return false;
      }

      if (location && !(
        tutor.location || ''
      ).toLowerCase().includes(location)) {
        return false;
      }

      if (mode && !(
        tutor.mode_preference === mode ||
        tutor.mode_preference === 'both'
      )) {
        return false;
      }

      return true;
    })
    .sort((a, b) => {
      const aVerified = a.tutor_profiles?.verified ? 1 : 0;
      const bVerified = b.tutor_profiles?.verified ? 1 : 0;

      if (aVerified !== bVerified) {
        return bVerified - aVerified;
      }

      const aMatch = a.subjects.some(
        s => state.studentSubjects.includes(s.id)
      ) ? 1 : 0;

      const bMatch = b.subjects.some(
        s => state.studentSubjects.includes(s.id)
      ) ? 1 : 0;

      if (aMatch !== bMatch) {
        return bMatch - aMatch;
      }

      return (b.rating.rating || 0) - (a.rating.rating || 0);
    });

  if (!filtered.length) {
    results.innerHTML = `
      <div class="empty">
        <h3>Belum ada tutor cocok</h3>
        <p>
          Coba longgarkan filter atau lengkapi preferensi belajar
          pada profilmu.
        </p>
      </div>
    `;
    return;
  }

  results.innerHTML = filtered.map(tutor => {
    const verified = tutor.tutor_profiles?.verified;
    const ratingText = tutor.rating.rating !== null
      ? `${stars(tutor.rating.rating)} <span>${tutor.rating.rating} (${tutor.rating.count} ulasan)</span> · `
      : '';

    const subjects = tutor.subjects.slice(0, 5);

    return `
      <div class="list-item">
        <div>
          <h4>
            ${escapeHtml(tutor.full_name)}
            ${verified ? `
              <span class="chip green" style="margin-left:6px;">
                ✓ Terverifikasi
              </span>
            ` : ''}
          </h4>

          <div class="meta">
            ${ratingText}
            ${Number(tutor.points.hours_taught || 0).toFixed(0)} jam mengajar
            · ${Number(tutor.points.points || 0)} poin
            ${tutor.location ? ` · ${escapeHtml(tutor.location)}` : ''}
            ${tutor.mode_preference ? ` · ${escapeHtml(tutor.mode_preference)}` : ''}
          </div>

          ${tutor.bio ? `
            <p style="margin-top:8px; font-size:0.92rem; color:var(--color-ink-soft);">
              ${escapeHtml(tutor.bio)}
            </p>
          ` : ''}

          ${tutor.tutor_profiles?.experience_description ? `
            <p style="margin-top:6px; font-size:0.9rem; color:var(--color-ink-soft);">
              ${escapeHtml(tutor.tutor_profiles.experience_description)}
            </p>
          ` : ''}

          <div class="chips">
            ${tutor.levels.map(level => `
              <span class="chip amber">${escapeHtml(level)}</span>
            `).join('')}

            ${subjects.map(subject => `
              <span class="chip">${escapeHtml(subject.name)}</span>
            `).join('')}
          </div>

          ${tutor.availability ? `
            <p class="meta" style="margin-top:8px;">
              <strong>Tersedia:</strong>
              ${escapeHtml(tutor.availability)}
            </p>
          ` : ''}
        </div>

        <div class="actions">
          <button
            class="btn-sm"
            data-ajukan="${escapeHtml(tutor.id)}"
            type="button">
            Ajukan sesi
          </button>
        </div>
      </div>
    `;
  }).join('');

  results.querySelectorAll('[data-ajukan]').forEach(button => {
    button.addEventListener('click', () => {
      const tutor = state.tutors.find(
        item => item.id === button.dataset.ajukan
      );

      if (tutor) openModal(tutor);
    });
  });
}

function openModal(tutor) {
  state.selectedTutor = tutor;

  document.getElementById('modalTutorInfo').textContent =
    `Tutor: ${tutor.full_name}`;

  sessionForm.reset();

  sessionForm.elements.tutor_id.value = tutor.id;

  const tutorSubjects = getTutorSubjects(tutor);

  const subjectSelect = document.getElementById('mp');

  subjectSelect.innerHTML = tutorSubjects.map(subject => `
    <option value="${escapeHtml(subject.id)}">
      ${escapeHtml(subject.name)}
    </option>
  `).join('');

  if (!tutorSubjects.length) {
    modalAlert.innerHTML = `
      <div class="alert alert-error">
        Tutor belum memiliki mata pelajaran yang tersedia.
      </div>
    `;
    return;
  }

  const availableLevels = getTutorLevels(tutor);
  const levelSelect = document.getElementById('jj');

  levelSelect.innerHTML = availableLevels.map(level => `
    <option value="${escapeHtml(level)}">${escapeHtml(level)}</option>
  `).join('');

  if (availableLevels.includes(state.studentLevel)) {
    levelSelect.value = state.studentLevel;
  }

  const now = new Date();
  now.setMinutes(now.getMinutes() + 30);

  const localDate = new Date(
    now.getTime() - now.getTimezoneOffset() * 60000
  ).toISOString().slice(0, 16);

  document.getElementById('scheduledAt').min = localDate;

  const modeSelect = sessionForm.elements.mode;

  if (tutor.mode_preference === 'online') {
    modeSelect.value = 'online';
  } else if (tutor.mode_preference === 'offline') {
    modeSelect.value = 'offline';
  }

  modalAlert.innerHTML = '';
  modal.classList.add('open');
}

document.getElementById('modalClose').addEventListener('click', () => {
  modal.classList.remove('open');
});

modal.addEventListener('click', event => {
  if (event.target === modal) {
    modal.classList.remove('open');
  }
});

btnFilter.addEventListener('click', renderTutors);

filterMp.addEventListener('change', renderTutors);
filterJj.addEventListener('change', renderTutors);
filterMode.addEventListener('change', renderTutors);

sessionForm.addEventListener('submit', async event => {
  event.preventDefault();

  if (!state.selectedTutor) return;

  const formData = new FormData(sessionForm);

  const scheduledAt = formData.get('scheduled_at');
  const duration = Number(formData.get('duration_min'));

  if (!scheduledAt || !duration || duration < 30 || duration > 180) {
    modalAlert.innerHTML = `
      <div class="alert alert-error">
        Periksa kembali tanggal, waktu, dan durasi sesi.
      </div>
    `;
    return;
  }

  const selectedDate = new Date(scheduledAt);

  if (Number.isNaN(selectedDate.getTime()) || selectedDate <= new Date()) {
    modalAlert.innerHTML = `
      <div class="alert alert-error">
        Jadwal sesi harus berada di masa mendatang.
      </div>
    `;
    return;
  }

  submitSession.disabled = true;
  submitSession.textContent = 'Mengirim...';
  modalAlert.innerHTML = '';

  const payload = {
    siswa_id: currentUser.id,
    tutor_id: state.selectedTutor.id,
    subject_id: formData.get('subject_id'),
    jenjang: formData.get('jenjang'),
    topik: formData.get('topik') || null,
    scheduled_at: selectedDate.toISOString(),
    duration_min: duration,
    mode: formData.get('mode'),
    location_or_link: formData.get('location_or_link') || null,
    notes: formData.get('notes') || null
  };

  try {
    const { error } = await supabase
      .from('sessions')
      .insert(payload);

    if (error) throw error;

    modal.classList.remove('open');
    sessionForm.reset();

    toast(
      'Permintaan sesi terkirim. Menunggu konfirmasi tutor.',
      'success'
    );

  } catch (error) {
    console.error(error);

    modalAlert.innerHTML = `
      <div class="alert alert-error">
        ${escapeHtml(error.message || 'Gagal mengirim permintaan sesi.')}
      </div>
    `;
  } finally {
    submitSession.disabled = false;
    submitSession.textContent = 'Kirim permintaan';
  }
});

try {
  await loadInitialData();
  await loadTutors();
} catch (error) {
  console.error(error);
  showError(error.message || 'Gagal memuat data awal.');
}

supabase.auth.onAuthStateChange((event, newSession) => {
  if (event === 'SIGNED_OUT' || !newSession) {
    window.location.replace('/pages/login.html');
  }
});
</script>
</body>
</html>
