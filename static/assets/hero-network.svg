<svg viewBox="0 0 480 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustrasi jaringan siswa dan tutor yang saling terhubung" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- connecting lines -->
  <g stroke="#1F3D2E" stroke-width="1.6" opacity="0.35">
    <path d="M120 150 C 170 190, 190 210, 235 235" />
    <path d="M235 235 C 270 200, 300 170, 355 120" />
    <path d="M235 235 C 210 280, 190 320, 150 360" />
    <path d="M235 235 C 280 270, 310 300, 350 330" />
    <path d="M355 120 C 390 140, 410 160, 420 200" />
    <path d="M150 360 C 180 385, 220 400, 260 405" />
  </g>

  <!-- tutor nodes (forest) -->
  <circle cx="120" cy="150" r="26" fill="#1F3D2E"/>
  <circle cx="355" cy="120" r="18" fill="#1F3D2E"/>
  <circle cx="150" cy="360" r="18" fill="#1F3D2E"/>

  <!-- central match point -->
  <circle cx="235" cy="235" r="14" fill="#E4A335" stroke="#F1F4EF" stroke-width="3"/>

  <!-- student nodes (sky) -->
  <circle cx="420" cy="200" r="22" fill="#4F7C8C"/>
  <circle cx="350" cy="330" r="24" fill="#4F7C8C"/>
  <circle cx="260" cy="405" r="16" fill="#4F7C8C"/>

  <!-- small dots for texture -->
  <circle cx="70" cy="260" r="4" fill="#E4A335" opacity="0.6"/>
  <circle cx="400" cy="60" r="4" fill="#4F7C8C" opacity="0.6"/>
  <circle cx="60" cy="60" r="3" fill="#1F3D2E" opacity="0.4"/>
</svg>
